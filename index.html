<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tran Duc Long's website. Work in progress — something new is taking shape.">
  <meta name="theme-color" content="#f5f2eb">
  <title>Work in progress · Tran Duc Long</title>
  <link rel="canonical" href="https://longtd.dev/">
  <link rel="icon" href="/portfolio/asset/icon.png">
  <style>
    :root { color-scheme: light; --paper: #f5f2eb; --ink: #292924; --muted: #68665e; --accent: #b34225; --line: #d4d0c6; --grid: #dedbd2; --mono: "Cascadia Code", Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(var(--grid) .8px, transparent .8px) 0 0 / 24px 24px; z-index: -1; }
    ::selection { background: var(--accent); color: var(--paper); }
    .page { min-height: 100svh; max-width: 1600px; margin: auto; padding: 30px clamp(24px, 4vw, 64px) 24px; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    header { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: -.03em; }
    .brand-mark { width: 30px; height: 30px; color: var(--accent); }
    .header-note { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 38px 0 64px; }
    .assembly { width: 210px; height: 158px; margin-bottom: 24px; overflow: visible; color: var(--accent); }
    .loose-piece { animation: tinker 5s ease-in-out infinite; }
    @keyframes tinker { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .status { margin: 0 0 24px; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .status::before { content: "[ "; color: var(--accent); }
    .status::after { content: " ]"; color: var(--accent); }
    h1 { margin: 0; font-size: clamp(68px, 8.5vw, 124px); font-weight: 500; line-height: .98; letter-spacing: -.065em; }
    h1 em { display: inline-block; padding-right: .08em; color: var(--accent); font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.06em; }
    .message { margin: 28px 0 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .pencil-line { width: 46px; height: 2px; margin-top: 28px; background: var(--accent); transform: rotate(-4deg); }
    footer { padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 10px; line-height: 1.6; }
    .footer-name { text-transform: uppercase; letter-spacing: .1em; }
    .footer-note { display: flex; align-items: center; gap: 8px; }
    .footer-note svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
    @media (max-width: 600px) {
      .page { padding-top: 24px; }
      header { padding-bottom: 20px; }
      .header-note { font-size: 9px; max-width: 90px; text-align: right; }
      main { padding: 40px 0 48px; }
      .assembly { width: 174px; height: 132px; margin-bottom: 24px; }
      .status { font-size: 9px; letter-spacing: .1em; }
      h1 { font-size: clamp(68px, 14vw, 84px); }
      .message { font-size: 14px; }
      footer { align-items: flex-start; gap: 16px; }
      .footer-note { max-width: 160px; font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .loose-piece { animation: none; } }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3N95N39ZR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', 'G-F3N95N39ZR');
  </script>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 5v22h22M13 19 27 5m-10 0h10v10" stroke="currentColor" stroke-width="2.5"/></svg>
        <span>longtd.dev</span>
      </div>
      <span class="header-note">A space in the making.</span>
    </header>
    <main>
      <svg class="assembly" viewBox="0 0 210 158" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="m30 103 72 41 78-45M42 79l60 35 60-35M102 114v30" stroke-dasharray="3 5" opacity=".45"/>
          <path d="m55 65 47 27 47-27-47-27-47 27Z" fill="var(--paper)"/>
          <path d="M55 65v48l47 27V92M102 140l47-27V65"/>
          <path d="m55 89 47 27 47-27M79 79v48m47-48v48" opacity=".45"/>
          <path d="m79 51 47 27m-47 0 47-27" opacity=".45"/>
          <g class="loose-piece">
            <path d="m135 27 22 13 23-13-23-13-22 13Z" fill="currentColor"/>
            <path d="M135 27v23l22 13V40m0 23 23-13V27" fill="var(--paper)"/>
            <path d="M157 40v23"/>
          </g>
          <path d="M165 83v17m-5-5 5 5 5-5M26 51h12m-6-6v12"/>
          <path d="m179 118 5 5m0-5-5 5" opacity=".6"/>
        </g>
      </svg>
      <p class="status">A little work behind the scenes</p>
      <h1>Work in<br><em>progress.</em></h1>
      <p class="message">Something new is taking shape.<br>Check back soon.</p>
      <div class="pencil-line" aria-hidden="true"></div>
    </main>
    <footer>
      <span class="footer-name">Tran Duc Long</span>
      <span class="footer-note"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 1v18M1 10h18M4 4l12 12M4 16 16 4" stroke="currentColor" stroke-width="1.5"/></svg>Made with curiosity.</span>
    </footer>
  </div>
</body>
</html>
