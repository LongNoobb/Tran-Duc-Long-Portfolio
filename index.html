<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tran Duc Long's website. Work in progress — something new is taking shape.">
  <meta name="theme-color" content="#111412">
  <title>Work in progress · Tran Duc Long</title>
  <link rel="canonical" href="https://longtd.dev/">
  <link rel="icon" href="/portfolio/asset/icon.png">
  <style>
    :root { color-scheme: dark; --background: #111412; --text: #f0f2ed; --muted: #a2aaa3; --accent: #b6eb93; --border: #303931; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font-family: "Segoe UI", sans-serif; }
    .page { min-height: 100svh; max-width: 1440px; margin: auto; padding: 36px clamp(24px, 6vw, 88px); display: flex; flex-direction: column; }
    header { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
    .brand-dot { color: var(--accent); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 80px 0; }
    .status { margin: 0 0 28px; display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    h1 { margin: 0; font-size: clamp(58px, 9vw, 128px); font-weight: 500; line-height: 1.02; letter-spacing: -.065em; }
    h1 span { color: var(--accent); }
    .message { max-width: 400px; margin: 30px 0 0; color: var(--muted); font-size: 17px; line-height: 1.7; }
    footer { padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 480px) { .page { padding-top: 28px; padding-bottom: 28px; } .message { font-size: 16px; } }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3N95N39ZR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', 'G-F3N95N39ZR');
  </script>
</head>
<body>
  <div class="page">
    <header>Tran Duc Long<span class="brand-dot">.</span></header>
    <main>
      <p class="status">A little work behind the scenes</p>
      <h1>Work in<br><span>progress.</span></h1>
      <p class="message">Something new is taking shape.<br>Check back soon.</p>
    </main>
    <footer>Made with curiosity by Tran Duc Long.</footer>
  </div>
</body>
</html>
